version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buildverse-backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=BuildVerse AI
      - DATABASE_URL=sqlite+aiosqlite:///./buildverse.db
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: buildverse-frontend
    ports:
      - "3000:80"
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
